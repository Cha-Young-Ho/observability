apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/Cha-Young-Ho/observability.git"
    targetRevision: main
    path: .
    directory:
      recurse: false                    # 하위 디렉터리(common/, apps/)는 건드리지 않는다
      include: "appset-*.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd                   # ApplicationSet은 argocd 네임스페이스에 산다
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [ServerSideApply=true]
