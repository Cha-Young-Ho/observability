apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: common
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    # common/*/config.json 을 스캔한다. (플랫폼 공통 도구)
    # 디렉터리 하나 추가 = 앱 하나 추가. 이 파일은 다시 고칠 일이 없다.
    - git:
        repoURL: "https://github.com/Cha-Young-Ho/observability.git"
        revision: main
        files:
          - {path: "common/*/config.json"}   # JSON의 최상위 키가 그대로 템플릿 변수가 된다
  # ── 템플릿: 각 항목을 어떤 Application으로 만들 것인가 ──
  template:
    metadata:
      name: '{{.name}}'                   # → Application/kps, /loki, /tempo
    spec:
      project: default
      sources:
        # 소스 1: Helm 저장소의 차트
        - repoURL: '{{.repoURL}}'
          chart: '{{.chart}}'
          targetRevision: '{{.version}}'   # 버전 고정 = 재현성
          helm:
            valueFiles:
              - $values/common/{{.name}}/values.yaml
        # 소스 2: values를 담은 내 Git 저장소
        - repoURL: "https://github.com/Cha-Young-Ho/observability.git"
          targetRevision: main
          ref: values                     # ↑ $values 라는 이름을 이 소스에 부여
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.namespace}}'     # config.json 이 정한다 (demo / observability)
      syncPolicy:
        automated: {prune: true, selfHeal: true}
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
