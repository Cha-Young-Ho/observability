apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    # AppProject 가 ApplicationSet 보다 먼저 만들어져야 한다.
    # 낮은 wave 가 먼저 적용된다.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: 플랫폼 공통 도구 — 관측 스택, 시크릿 컨트롤러 등

  # 이 저장소와, 여기서 쓰는 Helm 저장소에서만 배포할 수 있다.
  sourceRepos:
    - "https://github.com/Cha-Young-Ho/observability.git"
    - "https://prometheus-community.github.io/helm-charts"
    - "https://grafana.github.io/helm-charts"
    - "https://bitnami-labs.github.io/sealed-secrets"

  destinations:
    - {server: "https://kubernetes.default.svc", namespace: observability}
    - {server: "https://kubernetes.default.svc", namespace: kube-system}

  # kube-prometheus-stack 은 CRD·ClusterRole 등 클러스터 스코프 리소스를 만든다.
  # 플랫폼 프로젝트에만 이걸 허용한다.
  clusterResourceWhitelist:
    - {group: "*", kind: "*"}
