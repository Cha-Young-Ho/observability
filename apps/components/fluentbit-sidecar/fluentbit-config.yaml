apiVersion: v1
kind: ConfigMap
metadata:
  name: fluentbit-config
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush        5
        Log_Level    info
        Daemon       off

    [INPUT]
        Name   tail
        Path   /var/log/app/*.log
        Tag    app.*
        # DB 를 지정해야 "어디까지 읽었는지"를 기억한다.
        # 빠뜨리면 재시작마다 파일을 처음부터 다시 읽어 로그가 통째로 중복 전송된다.
        DB     /var/log/app/.fluentbit.db

    [OUTPUT]
        Name   loki
        Match  app.*
        Host   loki.observability.svc
        Port   3100
        # 여기서 붙인 라벨이 LogQL 의 {} 안에 들어간다.
        # 카디널리티가 폭발하지 않도록 값의 종류가 적은 것만 라벨로.
        Labels job=$kubernetes['labels']['app.kubernetes.io/name']
