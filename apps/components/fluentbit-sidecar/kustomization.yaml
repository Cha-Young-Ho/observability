apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# 파일 로그를 쓰는 앱만 켠다.
#
# 켜기 전에 확인할 것:
#   앱이 stdout 으로만 로그를 쓴다면 이 컴포넌트는 순수한 중복이다.
#   노드 레벨 수집기(Alloy/Promtail DaemonSet)가 이미 stdout 을 전부 긁고 있고,
#   사이드카는 파드마다 메모리를 30~50Mi 더 쓴다.
#
# 전제 조건:
#   base 의 Deployment 에 volumes 배열과 applogs 볼륨이 선언되어 있어야 한다.
#   (JSON 6902 의 "/-" 는 이미 존재하는 배열에만 추가할 수 있다)

resources:
  - fluentbit-config.yaml

patches:
  - path: sidecar-patch.yaml
    target:
      kind: Deployment
