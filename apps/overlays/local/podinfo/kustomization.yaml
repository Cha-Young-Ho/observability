apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo

resources:
  - ../../../base/podinfo

components:
  - ../../../components/chassis
  # podinfo 는 stdout 으로만 로그를 쓴다.
  # 노드 레벨 수집기가 이미 다 긁고 있으므로 사이드카는 켜지 않는다.
  # - ../../../components/fluentbit-sidecar

images:
  - name: ghcr.io/stefanprodan/podinfo
    newTag: "6.14.1"

patches:
  - target:
      kind: Deployment
      name: podinfo
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
