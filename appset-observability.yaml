apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: observability-stack
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elments:
          - {name: kps,   chart: kube-prometheus-stack, version: "88.0.1",
             repoURL: "https://prometheus-community.github.io/helm-charts"}
          - {name: loki,  chart: loki,  version: "7.2.0",
             repoURL: "https://grafana.github.io/helm-charts"}
          - {name: tempo, chart: tempo, version: "1.24.4",
             repoURL: "https://grafana.github.io/helm-charts"}
  # ── 템플릿: 각 항목을 어떤 Application으로 만들 것인가 ──
  template:
    metadata:
      name: '{{.name}}'                   # → Application/kps, /loki, /tempo
    spec:
      project: default
      sources:
        # 소스 1: Helm 저장소의 차트
        - repoURL: '{{.repoURL}}'
          chart: '{{.chart}}'
          targetRevision: '{{.version}}'   # 버전 고정 = 재현성
          helm:
            valueFiles:
              - $values/stacks/{{.name}}/values.yaml
        # 소스 2: values를 담은 내 Git 저장소
        - repoURL: "https://github.com/Cha-Young-Ho/observability.git"
          targetRevision: main
          ref: values                     # ↑ $values 라는 이름을 이 소스에 부여
      destination:
        server: https://kubernetes.default.svc
        namespace: observability
      syncPolicy:
        automated: {prune: true, selfHeal: true}
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
